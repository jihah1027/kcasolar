<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | KCAConnect</title>

    <!-- Google Fonts: Inter & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Main Style (Path goes up one level to css/) -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-white">
    <!-- Brand Accent Line -->
    <div class="brand-accent-bar"></div>

    <!-- Portal Navigation Bar -->
    <nav class="navbar navbar-light bg-white py-2 shadow-sm sticky-top">
      <div class="container d-flex justify-content-between align-items-center">
        <!-- Brand Logo (Reloads login screen) -->
        <a class="navbar-brand d-flex align-items-center p-0" href="login.html">
          <img
            src="../img/KCAConnect.png"
            alt="KCAConnect Logo"
            style="height: 44px"
            onerror="this.src = '../img/logo.png'"
          />
        </a>

        <!-- Back to Public Site (Path goes up one level) -->
        <a
          href="../index.html"
          class="btn btn-sm btn-outline-kca-orange rounded-pill px-3 py-1 fw-semibold d-inline-flex align-items-center gap-1"
        >
          <i class="bi bi-arrow-left"></i> Back to Website
        </a>
      </div>
    </nav>

    <div class="brand-accent-bar"></div>

    <!-- Main View: Background with Partitioned Form Area -->
    <main
      class="login-wrapper flex-grow-1 d-flex flex-column justify-content-center"
    >
      <div class="container-fluid p-0">
        <div class="row g-0 align-items-center">
          <!-- Left Column -->
          <div
            class="col-12 col-lg-6 ps-4 ps-md-5 pe-3 py-4 py-lg-5"
            data-aos="fade-right"
            data-aos-duration="700"
          >
            <div
              class="login-welcome-text mx-auto mx-lg-0"
              style="max-width: 480px"
            >
              <span class="fs-4 text-dark fw-semibold d-block mb-1"
                >Welcome to</span
              >
              <h1 class="mb-2">
                <span style="color: var(--tnb-blue)">KCA</span
                ><span style="color: var(--tnb-red-orange)">Connect</span>
              </h1>
              <div
                class="login-welcome-bar mb-3"
                data-aos="zoom-in"
                data-aos-delay="150"
              ></div>
              <p class="login-welcome-desc">
                Record daily attendance, verify site location, and manage
                operation.
              </p>
            </div>
          </div>

          <!-- Right Column -->
          <div class="col-12 col-lg-6 login-partition">
            <div
              class="login-card"
              data-aos="fade-left"
              data-aos-duration="700"
              data-aos-delay="200"
            >
              <h3 class="login-card-title">Sign in to your account</h3>

              <form id="loginForm">
                <!-- Staff ID -->
                <div class="mb-3">
                  <label class="login-field-label"
                    >ID<span class="req">*</span></label
                  >
                  <input
                    type="text"
                    id="staffIdInput"
                    name="staff_id"
                    class="login-input"
                    placeholder="e.g. KCA-004 or admin"
                    required
                    autofocus
                  />
                </div>

                <!-- Password -->
                <div class="mb-4">
                  <label class="login-field-label"
                    >Password<span class="req">*</span></label
                  >
                  <div class="position-relative">
                    <input
                      type="password"
                      id="passwordInput"
                      name="password"
                      class="login-input pe-5"
                      placeholder="Enter your password"
                      required
                    />
                    <button
                      type="button"
                      class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-secondary text-decoration-none pe-3 border-0 shadow-none"
                      onclick="togglePasswordVisibility()"
                      tabindex="-1"
                      aria-label="Toggle password visibility"
                    >
                      <i class="bi bi-eye fs-5" id="toggleEyeIcon"></i>
                    </button>
                  </div>
                </div>

                <!-- Login Error Alert Banner -->
                <div
                  id="loginAlert"
                  class="alert alert-danger d-none py-2 px-3 small fw-semibold text-center mb-3 rounded-2"
                  role="alert"
                ></div>

                <!-- Submit Button -->
                <button
                  type="submit"
                  id="btnSignIn"
                  class="btn btn-signin-navy w-100 mb-3 text-uppercase"
                >
                  SIGN IN
                </button>

                <!-- Help / Contact Support -->
                <div class="text-center">
                  <span class="text-secondary small fw-semibold">
                    Forgot Password?
                    <a
                      href="../contact.html"
                      class="text-dark fw-bold text-decoration-none"
                      >Contact Admin</a
                    >
                  </span>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 700,
        once: true,
      });
    </script>

    <!-- Toggle Password Visibility -->
    <script>
      function togglePasswordVisibility() {
        const passwordField = document.getElementById("passwordInput");
        const eyeIcon = document.getElementById("toggleEyeIcon");

        // 1. Capture current value before switching type
        const currentVal = passwordField.value;

        // 2. Toggle between text and password
        if (passwordField.type === "password") {
          passwordField.type = "text";
          eyeIcon.classList.remove("bi-eye");
          eyeIcon.classList.add("bi-eye-slash");
        } else {
          passwordField.type = "password";
          eyeIcon.classList.remove("bi-eye-slash");
          eyeIcon.classList.add("bi-eye");
        }

        // 3. Re-assign value so browser security doesn't clear it (hilang)
        if (currentVal) {
          passwordField.value = currentVal;
        }
      }
    </script>

    <!-- Real Database Authentication Script -->
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const staffIdInput = document
            .getElementById("staffIdInput")
            .value.trim();
          const passwordInput = document.getElementById("passwordInput").value;
          const loginAlert = document.getElementById("loginAlert");
          const btnSignIn = document.getElementById("btnSignIn");

          // Clear previous alerts & enter loading state
          loginAlert.classList.add("d-none");
          loginAlert.innerText = "";
          btnSignIn.disabled = true;
          btnSignIn.innerText = "SIGNING IN...";

          const formData = new FormData();
          formData.append("staff_id", staffIdInput);
          formData.append("password", passwordInput);

          // Path goes up one level to reach the php/ folder
          fetch("../php/login.php", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                // Store logged-in user profile in session storage
                sessionStorage.setItem("kca_user", JSON.stringify(data.user));

                // Redirect to destination (both admin-dashboard.html and staff-attendance.html are in this same folder)
                window.location.href = data.redirect;
              } else {
                loginAlert.innerText =
                  data.message || "Invalid credentials. Please try again.";
                loginAlert.classList.remove("d-none");
                btnSignIn.disabled = false;
                btnSignIn.innerText = "SIGN IN";
              }
            })
            .catch((error) => {
              console.error("Login Error:", error);
              loginAlert.innerText =
                "Unable to connect to the authentication server. Please try again.";
              loginAlert.classList.remove("d-none");
              btnSignIn.disabled = false;
              btnSignIn.innerText = "SIGN IN";
            });
        });
    </script>
  </body>
</html>
